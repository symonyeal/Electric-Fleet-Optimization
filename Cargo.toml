[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
publish = false
repository = "https://github.com/symonyeal/Electric-Fleet-Optimization"

[workspace.dependencies]
efo-kernels = { path = "crates/efo-kernels" }
faer = { version = "0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
pyo3 = "0.30.1"
numpy = "0.30.0"

[workspace.lints.clippy]
# The code transcribes the documents' notation: single-letter and short symbols are deliberate.
many_single_char_names = "allow"
similar_names = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2
