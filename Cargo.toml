[workspace]
resolver = "3"
members = ["crates/efo", "crates/efo-kernels"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
publish = false
repository = "https://github.com/symonyeal/Electric-Fleet-Optimization"

[workspace.dependencies]
efo-kernels = { path = "crates/efo-kernels" }
faer = { version = "0.24.4", default-features = false, features = ["std", "sparse-linalg"] }

[workspace.lints.clippy]
# The code transcribes the documents' notation: single-letter and short symbols are deliberate.
many_single_char_names = "allow"
similar_names = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 2
