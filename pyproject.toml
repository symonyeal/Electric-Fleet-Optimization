[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "efo"
version = "0.2.0"
description = "Rust kernels of Electric-Fleet-Optimization: ng-route pricing and the interior-point method"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0"]

[tool.maturin]
manifest-path = "crates/efo-py/Cargo.toml"
module-name = "efo"
features = ["extension-module"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "data: needs the fetched EVRP or GTFS files",
    "gtfs: needs the pinned GTFS snapshot, which cannot be fetched again (Data §2)",
    "slow: solves a benchmark instance to a certificate or a limit",
]

[tool.ruff]
line-length = 100
extend-exclude = ["crates/efo-highs/HiGHS"]

[tool.ruff.lint]
extend-select = ["E501"]
# E741 rejects l, I and O as names; the documents use them as symbols.
# I001 wraps imports one name per line, against the compact register of these files.
# C408: dict(k=v) is how these files write a record.
ignore = ["E741", "I001", "C408"]
