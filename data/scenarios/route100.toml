# Route 100 scenario (Data §3). Every value is illustrative unless its source says otherwise:
# no battery, charger, grid, tariff or cost figure of TransLink's is used or implied.

[time]
delta = {value = 300.0, unit = "s", source = "illustrative"}           # slot length
window = {value = 1800.0, unit = "s", source = "illustrative"}         # charging before a departure
layover = {value = 300.0, unit = "s", source = "illustrative"}         # least turnaround

[deadhead]
speed = {value = 25.0, unit = "km/h", source = "illustrative"}
detour = {value = 1.3, unit = "1", source = "illustrative"}            # road / great-circle distance

[depot]
lat = {value = 49.2106, unit = "deg", source = "illustrative"}         # assumed near Marine Dr / Knight St
lon = {value = -123.0770, unit = "deg", source = "illustrative"}

[battery]
B = {value = 250.0, unit = "kWh", source = "illustrative"}
reserve = {value = 0.20, unit = "1", source = "illustrative"}
smax = {value = 0.95, unit = "1", source = "illustrative"}
s0 = {value = 0.90, unit = "1", source = "illustrative"}
kappa = {value = 1.3, unit = "kWh/km", source = "illustrative"}         # consumption, trips and deadhead

[charger]
P = {value = 450.0, unit = "kW", source = "illustrative"}              # the pilot charged fully in 4-7 min
eta = {value = 0.92, unit = "1", source = "illustrative"}
alpha = {value = 6.7e-5, unit = "1/kW", source = "illustrative"}       # M2 loss: 3% extra at P
gamma = {value = 1.0e-4, unit = "CAD/(kW^2 h)", source = "illustrative"}  # M1-Q stress proxy

