# A derived stress case, not TransLink's pack: route100-rs1650.toml with the pack that would
# just give TransLink's "over 150 km" at the assumed kappa, reserve and smax. It is conditional
# on those assumptions and does not bracket the installed pack with 594 kWh (Data §3).
# Route 100 on sourced parameters: the on-route chargers on BC Hydro's Demand Transition Rate,
# the depot on the Overnight Rate, charging 22:00-06:00 (Data §3). A value cites its source in
# docs/SOURCES.md, or is `illustrative`. Tariff amounts are before taxes and levies, as the
# tariff states them. route100-rs1640.toml differs only in [cost].

[time]
delta = {value = 300.0, unit = "s", source = "illustrative"}           # slot length
window = {value = 1800.0, unit = "s", source = "illustrative"}         # charging before a departure
layover = {value = 300.0, unit = "s", source = "illustrative"}         # least turnaround

[deadhead]
speed = {value = 25.0, unit = "km/h", source = "illustrative"}
detour = {value = 1.3, unit = "1", source = "illustrative"}            # road / great-circle distance

[depot]
lat = {value = 49.2106, unit = "deg", source = "illustrative"}         # not found; see Data §3
lon = {value = -123.0770, unit = "deg", source = "illustrative"}

[battery]
B = {value = 285.8, unit = "kWh", source = "derived stress case: TransLink 'over 150 km' (Buzzer 2023-02-02) x kappa / (smax - reserve), conditional on the assumed kappa, reserve and smax; not the installed pack"}
reserve = {value = 0.20, unit = "1", source = "illustrative"}
smax = {value = 0.95, unit = "1", source = "illustrative"}
s0 = {value = 0.90, unit = "1", source = "illustrative"}
kappa = {value = 1.42915, unit = "kWh/km", source = "CARB 2018 Table 2: Altoona 40-ft BEB, Arterial cycle 2.3 kWh/mi (27 mph)"}

[charger]
P = {value = 450.0, unit = "kW", source = "illustrative"}              # TransLink's rating not found
eta = {value = 0.90, unit = "1", source = "CARB 2018 Appendix 1: Foothill Transit on-route charging, one year of utility bills"}
alpha = {value = 6.7e-5, unit = "1/kW", source = "illustrative"}       # M2 only
gamma = {value = 1.0e-4, unit = "CAD/(kW^2 h)", source = "illustrative"}  # M1-Q only

[sites.marpole]
name = "Marpole Loop"
stops = ["745", "12027"]
nbar = {value = 5.0, unit = "plugs", source = "illustrative: TransLink 2025-06-27 counts 10 on-route chargers system-wide; their split between the loops is not published"}
G0 = {value = 0.0, unit = "kW", source = "illustrative"}
hbar = {value = 1500.0, unit = "kW", source = "illustrative"}
L = {value = 0.0, unit = "kW", source = "illustrative"}                 # other load at the site

[sites.station22]
name = "22nd Street Station"
stops = ["5989", "10929"]
nbar = {value = 5.0, unit = "plugs", source = "illustrative: TransLink 2025-06-27 counts 10 on-route chargers system-wide; their split between the loops is not published"}
G0 = {value = 0.0, unit = "kW", source = "illustrative"}
hbar = {value = 1500.0, unit = "kW", source = "illustrative"}
L = {value = 0.0, unit = "kW", source = "illustrative"}

[cost]
F = {value = 400.0, unit = "CAD/bus/day", source = "illustrative"}
deadhead = {value = 1.5, unit = "CAD/km", source = "illustrative"}
site = {value = 300.0, unit = "CAD/day", source = "illustrative"}
plug = {value = 100.0, unit = "CAD/plug/day", source = "illustrative"}
upgrade = {value = 0.05, unit = "CAD/kW/day", source = "illustrative"}
energy = {value = 0.1137, unit = "CAD/kWh", source = "BC Hydro Electric Tariff RS 1650 Rev 12 (2026-04-01): energy 11.37 c/kWh (F2027)"}
depot_energy = {value = 0.0838, unit = "CAD/kWh", source = "BC Hydro Electric Tariff RS 1640 Rev 13 (2026-04-01): energy 8.38 c/kWh; depot charging in 22:00-06:00 is assumed, not modeled"}
peak = {value = 0.075945, unit = "CAD/kW/day", source = "BC Hydro Electric Tariff RS 1650 Rev 12: $2.31/kW of Billing Demand (F2027) x 12/365, a normalized daily sensitivity weight, not a bill"}
basic = {value = 0.2999, unit = "CAD/day/site", source = "BC Hydro Electric Tariff RS 1650 Rev 12: basic 29.99 c/day"}
rider = {value = -0.015, unit = "1", source = "BC Hydro Electric Tariff RS 1901 Rev 13 '(1.5)%' as a credit; RS 1904 Rev 2: 0%"}
