# Route 100 on sourced parameters, every meter on BC Hydro's Overnight Rate (Data §3).
# A value cites its source in docs/SOURCES.md, or is `illustrative`. Tariff amounts are before
# taxes and levies, as the tariff states them. route100-rs1650.toml differs only in [cost].

[time]
delta = {value = 300.0, unit = "s", source = "illustrative"}           # slot length
window = {value = 1800.0, unit = "s", source = "illustrative"}         # charging before a departure
layover = {value = 300.0, unit = "s", source = "illustrative"}         # least turnaround

[deadhead]
speed = {value = 25.0, unit = "km/h", source = "illustrative"}
detour = {value = 1.3, unit = "1", source = "illustrative"}            # road / great-circle distance

[depot]
lat = {value = 49.2106, unit = "deg", source = "illustrative"}         # not found; see Data §3
lon = {value = -123.0770, unit = "deg", source = "illustrative"}

[battery]
B = {value = 594.0, unit = "kWh", source = "Nova Bus LFSe+ total battery capacity (Volvo Group, 2022-09)"}
reserve = {value = 0.20, unit = "1", source = "illustrative"}
smax = {value = 0.95, unit = "1", source = "illustrative"}
s0 = {value = 0.90, unit = "1", source = "illustrative"}
kappa = {value = 1.42915, unit = "kWh/km", source = "CARB 2018 Table 2: Altoona 40-ft BEB, Arterial cycle 2.3 kWh/mi (27 mph)"}

[charger]
P = {value = 450.0, unit = "kW", source = "illustrative"}              # TransLink's rating not found
eta = {value = 0.90, unit = "1", source = "CARB 2018 Appendix 1: Foothill Transit on-route charging, one year of utility bills"}
alpha = {value = 6.7e-5, unit = "1/kW", source = "illustrative"}       # M2 only
gamma = {value = 1.0e-4, unit = "CAD/(kW^2 h)", source = "illustrative"}  # M1-Q only

[sites.marpole]
name = "Marpole Loop"
stops = ["745", "12027"]
nbar = {value = 5.0, unit = "plugs", source = "TransLink 2025-06-27: 10 on-route overhead chargers; 5 per loop is an inference"}
G0 = {value = 0.0, unit = "kW", source = "illustrative"}
hbar = {value = 1500.0, unit = "kW", source = "illustrative"}
L = {value = 0.0, unit = "kW", source = "illustrative"}                 # other load at the site

[sites.station22]
name = "22nd Street Station"
stops = ["5989", "10929"]
nbar = {value = 5.0, unit = "plugs", source = "TransLink 2025-06-27: 10 on-route overhead chargers; 5 per loop is an inference"}
G0 = {value = 0.0, unit = "kW", source = "illustrative"}
hbar = {value = 1500.0, unit = "kW", source = "illustrative"}
L = {value = 0.0, unit = "kW", source = "illustrative"}

[cost]
F = {value = 400.0, unit = "CAD/bus/day", source = "illustrative"}
deadhead = {value = 1.5, unit = "CAD/km", source = "illustrative"}
site = {value = 300.0, unit = "CAD/day", source = "illustrative"}
plug = {value = 100.0, unit = "CAD/plug/day", source = "illustrative"}
upgrade = {value = 0.05, unit = "CAD/kW/day", source = "illustrative"}
energy = {value = 0.0838, unit = "CAD/kWh", source = "BC Hydro Electric Tariff RS 1640 Rev 13 (2026-04-01): energy 8.38 c/kWh"}
depot_energy = {value = 0.0838, unit = "CAD/kWh", source = "BC Hydro Electric Tariff RS 1640 Rev 13 (2026-04-01): energy 8.38 c/kWh"}
peak = {value = 0.454685, unit = "CAD/kW/day", source = "BC Hydro Electric Tariff RS 1640 Rev 13: $13.83/kW per billing period, x 12/365"}
peak_from = {value = 6.0, unit = "h", source = "BC Hydro Electric Tariff RS 1640 Rev 13: Billing Demand between 06:00 and 22:00"}
peak_to = {value = 22.0, unit = "h", source = "BC Hydro Electric Tariff RS 1640 Rev 13: Billing Demand between 06:00 and 22:00"}
basic = {value = 0.2999, unit = "CAD/day/site", source = "BC Hydro Electric Tariff RS 1640 Rev 13: basic 29.99 c/day"}
