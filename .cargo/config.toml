# highs-sys builds HiGHS through the cmake crate, which strips optimization flags and then sets
# CMake's release flags without them: on MSVC the solver was compiled unoptimized (R3 on
# E-n22-k4[far 6] took 457 s instead of 81 s). cl.exe reads extra options from CL; elsewhere
# the variable is unused.
[env]
CL = "/O2"
