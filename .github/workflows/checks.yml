name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # HiGHS is built from source by highs-sys: CMake, and libclang for its bindings.
      - run: python -m pip install cmake libclang
      - name: Locate native build tools
        shell: python
        run: |
          import os
          from pathlib import Path
          import cmake, clang
          with open(os.environ["GITHUB_ENV"], "a") as f:
              suffix = ".exe" if os.name == "nt" else ""
              f.write(f"CMAKE={Path(cmake.CMAKE_BIN_DIR) / ('cmake' + suffix)}\n")
              f.write(f"LIBCLANG_PATH={Path(clang.__file__).parent / 'native'}\n")
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The benchmark is fetched from evrp-python at commit 16d3499 and checked against
      # data/evrp.sha256; the report then replays every admitted bundle and must be unchanged.
      - name: Fetch the pinned benchmark
        shell: bash
        run: |
          url=https://raw.githubusercontent.com/NeiH4207/evrp-python/16d3499799ab7aa7bc3f11a5eaf8604947389462/benchmarks
          while read -r sum key; do
            key=${key%$'\r'}  # a Windows checkout ends lines with CRLF
            mkdir -p "data/fetched/$(dirname "$key")"
            curl -fsSL "$url/$key" -o "data/fetched/$key"
          done < data/evrp.sha256
      - run: cargo test --workspace --locked --release
      - run: cargo run --release --locked -p efo -- report
      - run: git diff --exit-code -- README.md docs/results/README.md
